name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install Yarn (Corepack)
        run: corepack enable && corepack prepare yarn@stable --activate

      - name: Install Dependencies
        run: yarn install --immutable
        env:
          YARN_IGNORE_ENGINES: 1

      - name: Lint (ESLint)
        run: yarn nx lint travel-admin

      - name: Unit Tests (Jest)
        run: yarn nx test travel-admin

  deploy-app:
    runs-on: ubuntu-latest
    needs: test-app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install Yarn (Corepack)
        run: corepack enable && corepack prepare yarn@stable --activate

      - name: Install Dependencies
        run: yarn install --immutable
        env:
          YARN_IGNORE_ENGINES: 1

      - name: Build Application (Production)
        run: yarn nx build travel-admin --configuration=production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAVEL_DASHBOARD_F98A3 }}'
          channelId: live
          projectId: travel-dashboard-f98a3

  test-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install Firebase Functions Dependencies
        run: cd functions && npm ci

      - name: Unit Tests (Jest)
        run: cd functions && npm run test

  deploy-functions:
    runs-on: ubuntu-latest
    needs: test-functions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install Firebase Functions Dependencies
        run: cd functions && npm ci

      - name: Generate .env for Firebase Functions
        run: |
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> functions/.env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> functions/.env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> functions/.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> functions/.env

      - name: Deploy Firebase Functions
        run: |
          npm install -g firebase-tools
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAVEL_DASHBOARD_F98A3 }}' > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp_key.json
          firebase deploy --only functions --force
          rm gcp_key.json
